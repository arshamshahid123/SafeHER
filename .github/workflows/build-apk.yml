
name: Build SafeHER APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout SafeHER
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5 \
            libncurses5-dev \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install "cython<3.2"

      - name: Prepare Buildozer Android SDK
        run: |
          SDK_PATH="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK_PATH"

          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"

          echo "Android SDK path:"
          echo "$SDK_PATH"

          if [ -x "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_PATH" \
            "platform-tools" \
            "build-tools;37.0.0" \
            "platforms;android-35"

          echo "Android SDK packages installed."

      - name: Verify AIDL
        run: |
          SDK_PATH="$HOME/.buildozer/android/platform/android-sdk"

          echo "Checking build-tools directory..."
          ls -la "$SDK_PATH/build-tools"

          echo "Checking AIDL..."

          test -f "$SDK_PATH/build-tools/37.0.0/aidl"

          echo "AIDL found successfully:"
          ls -lh "$SDK_PATH/build-tools/37.0.0/aidl"

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build SafeHER APK
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          buildozer -v android debug

      - name: Check APK
        run: |
          echo "Generated APK:"
          ls -lah bin/

          test -n "$(find bin -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeHER-APK
          path: bin/*.apk


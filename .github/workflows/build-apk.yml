name: Build SafeHER APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout SafeHER
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5 \
            libncurses5-dev \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install "cython<3.2"

      - name: Set Android environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "JAVA_HOME=$JAVA_HOME_17_X64"
          echo "ANDROID_HOME=$ANDROID_HOME"

          java -version
          javac -version
          python --version
          buildozer --version
          cython --version

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build SafeHER APK
        run: |
          buildozer -v android debug

      - name: Check APK
        run: |
          echo "Checking generated APK..."
          ls -lah bin/
          test -n "$(find bin -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeHER-APK
          path: bin/*.apk
          if-no-files-found: error

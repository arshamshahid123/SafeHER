name: Build SafeHER APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout SafeHER
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5 \
            libncurses5-dev \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install "cython<3.2"

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROIDSDK=/usr/local/lib/android/sdk

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Checking Android SDK..."

          test -d "$ANDROID_HOME"
          find "$ANDROID_HOME" -maxdepth 2 -type d | head -30

          echo "Accepting Android SDK licenses..."

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          echo "Installing Android packages..."

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-35"

      - name: Verify Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROIDSDK=/usr/local/lib/android/sdk

          echo "Installed build tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo "Checking AIDL:"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo "AIDL found successfully."

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build SafeHER APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROIDSDK: /usr/local/lib/android/sdk
        run: |
          buildozer -v android debug

      - name: Check APK
        run: |
          echo "Generated APK:"
          ls -lah bin/
          test -n "$(find bin -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeHER-APK
          path: bin/*.apk
          if-no-files-found: error

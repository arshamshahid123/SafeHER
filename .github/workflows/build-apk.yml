
name: Build SafeHER APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout SafeHER
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5 \
            libncurses5-dev \
            libffi-dev \
            libssl-dev

           - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.5.0"
          python -m pip install "cython<3.2"

      - name: Prepare Android SDK
        run: |
          SYSTEM_SDK="/usr/local/lib/android/sdk"
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "SYSTEM_SDK=$SYSTEM_SDK"
          echo "BUILDOZER_SDK=$BUILDOZER_SDK"

          mkdir -p "$BUILDOZER_SDK"

          echo "ANDROID_HOME=$BUILDOZER_SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$BUILDOZER_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$BUILDOZER_SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "Checking sdkmanager..."
          test -x "$SDKMANAGER"

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --licenses || true

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "build-tools;37.0.0" \
            "platforms;android-35"

          echo "Copying Android SDK..."

          cp -a "$SYSTEM_SDK/." "$BUILDOZER_SDK/"

          echo "Creating legacy sdkmanager path..."

          mkdir -p "$BUILDOZER_SDK/tools/bin"

          ln -sf \
            "$BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$BUILDOZER_SDK/tools/bin/sdkmanager"

          echo "Checking legacy sdkmanager..."

          ls -lh "$BUILDOZER_SDK/tools/bin/sdkmanager"

          echo "Testing sdkmanager..."

          "$BUILDOZER_SDK/tools/bin/sdkmanager" --version

      - name: Verify Android SDK and AIDL
        run: |
          SDK_PATH="$HOME/.buildozer/android/platform/android-sdk"

          echo "Android SDK:"
          echo "$SDK_PATH"

          echo "Build tools:"
          ls -la "$SDK_PATH/build-tools"

          echo "AIDL:"
          ls -lh "$SDK_PATH/build-tools/37.0.0/aidl"

          test -f "$SDK_PATH/build-tools/37.0.0/aidl"

          echo "AIDL found successfully."

          echo "sdkmanager:"
          ls -lh "$SDK_PATH/tools/bin/sdkmanager"

          test -x "$SDK_PATH/tools/bin/sdkmanager"

          echo "sdkmanager found successfully."

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build SafeHER APK
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          buildozer -v android debug

      - name: Check APK
        run: |
          echo "Generated APK:"
          ls -lah bin/

          test -n "$(find bin -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeHER-APK
          path: bin/*.apk

